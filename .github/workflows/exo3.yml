name: Exo 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm i
      - run: npm ci
      - run: npm run build
      - run: |
          if [ ! -d dist ]; then
            echo "::error::Le dossier dist/n n'existe pas"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

      - run: |
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "Status : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit : ${{ github.sha }}"  >> $GITHUB_STEP_SUMMARY

  test:
    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    environment: preprod
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: |
          if [ ! -d dist ]; then
            echo "::error::Le dossier dist/n n'existe pas"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: dist/
      - run: npm run test
      - run: |
          echo "Environement : ${{ vars.ENV }}"
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "Status : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit : ${{ github.sha }}"  >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: |
          echo "Environement : ${{ vars.ENV }}"
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "Status : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit : ${{ github.sha }}"  >> $GITHUB_STEP_SUMMARY
